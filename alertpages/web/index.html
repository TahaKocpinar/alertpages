<!doctype html>
<html lang="{{LANG}}" dir="{{DIR}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta name="theme-color" content="#b3261e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="alternate" type="application/rss+xml" href="feed.xml" title="{{TITLE}}">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>{{TITLE}}</h1>
  <div class="controls">
    <select id="lang" aria-label="Language"></select>
    <select id="kind" aria-label="Type"></select>
    <select id="mag" aria-label="Magnitude"></select>
    <button id="install" hidden></button>
  </div>
</header>
<div id="banner" role="status" hidden></div>
<main id="list" aria-live="polite"><p class="muted">…</p></main>
<footer>
  <p id="updated" class="muted"></p>
  <details><summary id="status-title"></summary><ul id="status"></ul></details>
  <p><a id="feed" href="feed.xml"></a></p>
  <p id="disclaimer" class="muted"></p>
</footer>
<noscript>alerts.json / feed.xml</noscript>
<script src="app.js"></script>
</body>
</html>
