# Türkiye earthquakes (AFAD + Kandilli + EMSC, merged) and global GDACS alerts.
# Copy one of the files in examples/ over this one to change the preset.

[site]
title = "Deprem ve Afet Uyarıları"
description = "AFAD, Kandilli, EMSC ve GDACS uyarıları tek sayfada; çevrimdışı çalışır."
languages = ["tr", "en", "ar"]
default_language = "tr"
timezone = "Europe/Istanbul"
refresh_minutes = 5
max_items = 300

[[sources]]
type = "afad"
lookback_hours = 72

[[sources]]
type = "kandilli"   # HTML page, unreachable from some networks; failures are shown, not fatal

[[sources]]
type = "emsc"
lookback_hours = 72
bbox = [25.5, 35.5, 45.0, 42.5]   # min_lon, min_lat, max_lon, max_lat

[[sources]]
type = "gdacs"

[merge]
prefer = ["afad", "kandilli", "emsc", "usgs", "gdacs"]
window_seconds = 90
distance_km = 100

# What the page shows
[display]
max_age_hours = 72
min_magnitude = 2.0

# What is pushed to Telegram (needs TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID secrets)
[telegram]
language = "tr"
min_magnitude = 4.0
min_severity = "severe"          # non-earthquake alerts (GDACS Orange/Red)
max_age_hours = 6
bbox = [25.5, 35.5, 45.0, 42.5]
max_messages_per_run = 10
