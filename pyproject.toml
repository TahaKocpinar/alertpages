[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alertpages"
version = "0.1.0"
description = "Zero-server disaster alert relay: GitHub Actions polls AFAD, Kandilli, EMSC, USGS, GDACS and CAP feeds, publishes an offline-capable page on GitHub Pages and pushes new alerts to Telegram."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []
keywords = ["earthquake", "disaster", "alert", "cap", "github-pages", "telegram", "afad", "kandilli"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
]

[project.scripts]
alertpages = "alertpages.cli:main"

[project.urls]
Homepage = "https://github.com/TahaKocpinar/alertpages"

[tool.setuptools]
packages = ["alertpages", "alertpages.sources"]

[tool.setuptools.package-data]
alertpages = ["web/*"]
